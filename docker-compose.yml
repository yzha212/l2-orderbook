name: l2-orderbook
networks:
  redpanda_network:
    driver: bridge
volumes:
  redpanda-0: null
services:
  redpanda-0:
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Address the broker advertises to clients that connect to the Kafka API.
      # Use the internal addresses to connect to the Redpanda brokers'
      # from inside the same Docker network.
      # Use the external addresses to connect to the Redpanda brokers'
      # from outside the Docker network.
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      # Address the broker advertises to clients that connect to the HTTP Proxy.
      - --advertise-pandaproxy-addr internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      # Redpanda brokers use the RPC API to communicate with each other internally.
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      # Mode dev-container uses well-known configuration properties for development in containers.
      - --mode dev-container
      # Tells Seastar (the framework Redpanda uses under the hood) to use 1 core on the system.
      - --smp 1
      - --default-log-level=info
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.1
    container_name: redpanda-0
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    networks:
      - redpanda_network
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    # No restart policy on purpose, which means the Docker default of "no". Nothing in this
    # pipeline should come back by itself after a reboot; it is started when someone starts
    # it. Do not "fix" this by adding unless-stopped -- that is what the services downstream
    # used to have, and it is how they ended up running without this broker for hours.
    # The broker accepts connections before it can serve topic admin calls, so anything
    # that creates topics must gate on this, not on the container merely starting.
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:v3.11.0
    networks:
      - redpanda_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - 8080:8080
    depends_on:
      redpanda-0:
        condition: service_healthy

  topic-init:
    container_name: l2-topic-init
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.1
    # One-shot: create the topics the services need, verify them, exit. Not long-running.
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        # `rpk topic create` exits non-zero when the topic already exists, so tolerate that
        # and let the check below decide. This keeps repeated `up` runs idempotent.
        rpk topic create l2.raw.btc-usd -p 1 -r 1 \
          -c retention.ms=86400000 \
          -c max.message.bytes=8388608 \
          -X brokers=redpanda-0:9092 || true
        # create is a no-op on an existing topic, so set the limits unconditionally too:
        # the opening L2 snapshot frame is ~5 MB and the 1 MiB default rejects it.
        # retention.ms is set here as well because create never reapplies it to a topic that
        # already exists, and a capture that now runs all day needs that ceiling to hold.
        # segment.ms closes a segment every hour, because retention only deletes closed ones.
        rpk topic alter-config l2.raw.btc-usd \
          --set max.message.bytes=8388608 \
          --set retention.ms=86400000 \
          --set segment.ms=3600000 \
          -X brokers=redpanda-0:9092
        # Real gate: fail the service if the topic is not actually there afterwards.
        rpk topic list -X brokers=redpanda-0:9092 | grep -q '^l2.raw.btc-usd'
        # Print the settled config so `docker compose logs topic-init` shows what landed.
        rpk topic describe l2.raw.btc-usd -X brokers=redpanda-0:9092
        # Stage 4's output: the top of the book, published about ten times a second. No
        # max.message.bytes here because a record of ten levels a side is around a kilobyte.
        rpk topic create l2.book.btc-usd -p 1 -r 1 \
          -c retention.ms=86400000 \
          -c segment.ms=600000 \
          -X brokers=redpanda-0:9092 || true
        # Set unconditionally for the same reason as above: create is a no-op on an existing
        # topic. A day of retention rather than the hour this used to keep, because the topic
        # is now what holds the records that are not on disk yet: the archiver records its
        # position only after a whole bucket has been written and moved into place, so a stop
        # or a crash sends it back to the last bucket boundary to read those records again.
        # How long this topic keeps them is therefore how long the archiver can be down before
        # records are deleted before they were ever archived, which is the one loss nothing
        # here can undo. An hour left about forty-five minutes of room; a day matches the raw
        # topic, survives being left off overnight, and costs roughly 600 MB.
        # segment.ms sits well under that, because only a closed segment gets deleted.
        rpk topic alter-config l2.book.btc-usd \
          --set retention.ms=86400000 \
          --set segment.ms=600000 \
          -X brokers=redpanda-0:9092
        rpk topic list -X brokers=redpanda-0:9092 | grep -q '^l2.book.btc-usd'
        rpk topic describe l2.book.btc-usd -X brokers=redpanda-0:9092
    networks:
      - redpanda_network
    depends_on:
      redpanda-0:
        condition: service_healthy
    restart: "no"

  ingest:
    container_name: l2-ingest
    build:
      # Build from the repo root so COPY can reach both requirements.txt and src/.
      context: .
      # The Dockerfile is colocated with the service it builds.
      dockerfile: src/ingest/Dockerfile
    # Frames go straight to the topic, so the container needs no bind mount and writes no files.
    environment:
      REDPANDA_BROKERS: redpanda-0:9092
    networks:
      - redpanda_network
    depends_on:
      topic-init:
        condition: service_completed_successfully
      # Starts the book container first, as a nudge and nothing more. Compose guarantees start
      # order but never readiness, so correctness cannot rest on it -- and does not need to:
      # the topic is the buffer and the book waits on an empty one, so either order is fine.
      book:
        condition: service_started
    # on-failure, not unless-stopped: a crash exits non-zero and should come straight back,
    # but a reboot should start nothing at all. Docker restarts an unless-stopped container
    # when the daemon itself starts, and on 11 Sep that brought this service back after a
    # reboot while redpanda-0 -- which has no restart policy -- stayed down, so it ran for
    # three and a half hours talking to a broker that was not there. on-failure covers the
    # crash and not the reboot. A clean stop exits zero, so `compose stop` still means stopped.
    # The capture itself runs until stopped.
    restart: on-failure
    # The producer drains its queue for up to 10 s on stop; leave room before the kill.
    stop_grace_period: 15s

  book:
    container_name: l2-book
    build:
      # Build from the repo root so COPY can reach both requirements.txt and src/.
      context: .
      # The Dockerfile is colocated with the service it builds.
      dockerfile: src/book/Dockerfile
    # Reads from the topic and prints; no bind mount, no files written.
    environment:
      REDPANDA_BROKERS: redpanda-0:9092
      # The consumer group this reader joins. Each service reading a topic needs its own:
      # members of one group split the partitions between them instead of each getting a
      # copy, so on this single-partition topic a shared id leaves one service reading
      # nothing at all, with no error to say so.
      CONSUMER_GROUP: l2-book
    networks:
      - redpanda_network
    # Only the topic has to exist. The reader now waits on an empty one instead of giving up,
    # so it no longer matters whether ingest has published anything yet, or even started.
    depends_on:
      topic-init:
        condition: service_completed_successfully
    # on-failure, not unless-stopped: a crash exits non-zero and should come straight back,
    # but a reboot should start nothing at all. Docker restarts an unless-stopped container
    # when the daemon itself starts, and on 11 Sep that brought this service back after a
    # reboot while redpanda-0 -- which has no restart policy -- stayed down, so it ran for
    # three and a half hours talking to a broker that was not there. on-failure covers the
    # crash and not the reboot. A clean stop exits zero, so `compose stop` still means stopped.
    # Be aware that a restart replays the retained topic from the beginning, which is how
    # this service finds a snapshot again.
    restart: on-failure
    stop_grace_period: 15s

  dashboard:
    # No container_name: `docker compose run` ignores it and names the container itself, so
    # setting one here would only promise something the way this service is started cannot keep.
    build:
      # Build from the repo root so COPY can reach both requirements.txt and src/.
      context: .
      # The Dockerfile is colocated with the service it builds.
      dockerfile: src/dashboard/Dockerfile
    # Reads the published book and draws it; no bind mount, no files written.
    environment:
      REDPANDA_BROKERS: redpanda-0:9092
      # Its own group, for the same reason the book service has one: members of a group split
      # the partitions between them, so a shared id on this single-partition topic would leave
      # one of the two services reading nothing at all, with no error to say so.
      CONSUMER_GROUP: l2-dashboard
    networks:
      - redpanda_network
    # A terminal, not a pipe. Rich checks what stdout is attached to and quietly turns the live
    # refresh off when it is not a terminal, printing one frame at the end instead of updating.
    tty: true
    stdin_open: true
    # Kept out of `docker compose up`, so its escape sequences never land in the shared log.
    # This is a view you open when you want it: `docker compose run --rm dashboard`, which
    # turns the profile on by itself and attaches a terminal.
    profiles:
      - dashboard
    # Only the topic has to exist; an empty one is something to wait on, as it is for the book.
    depends_on:
      topic-init:
        condition: service_completed_successfully
    # No restart policy: this is run on demand and ends when the person watching stops it.

  book-archive:
    container_name: l2-book-archive
    build:
      # Build from the repo root so COPY can reach both requirements.txt and src/.
      context: .
      # The Dockerfile is colocated with the service it builds.
      dockerfile: src/book_archive/Dockerfile
    # The one service that writes files. Buckets land in /app/data inside the container and
    # this surfaces them on the host, where they can be queried without a docker cp first.
    volumes:
      - ./data:/app/data
    # Match the host uid:gid so the .parquet files are readable and deletable without sudo.
    # Without this the container runs as root and every file it writes is owned by root.
    user: "1000:1000"
    environment:
      REDPANDA_BROKERS: redpanda-0:9092
      # Its own group, for the same reason the book service has one: members of a group split
      # the partitions between them, so a shared id on this single-partition topic would leave
      # one of the two services reading nothing at all, with no error to say so. Here the group
      # does a second job as well -- it is what stops two archivers writing the same file.
      CONSUMER_GROUP: l2-book-archive
    networks:
      - redpanda_network
    # Only the topic has to exist; an empty one is something to wait on, as it is for the book.
    depends_on:
      topic-init:
        condition: service_completed_successfully
    # on-failure, not unless-stopped: a crash exits non-zero and should come straight back,
    # but a reboot should start nothing at all. Docker restarts an unless-stopped container
    # when the daemon itself starts, and on 11 Sep that brought this service back after a
    # reboot while redpanda-0 -- which has no restart policy -- stayed down, so it ran for
    # three and a half hours talking to a broker that was not there. on-failure covers the
    # crash and not the reboot. A clean stop exits zero, so `compose stop` still means stopped.
    # A restart goes back to the last bucket boundary and reads those records again, which
    # is why the book topic keeps a day rather than an hour.
    restart: on-failure
    # A stop drops the bucket still being gathered and leaves its position unrecorded, which
    # costs nothing; the time here is for the fetch in flight and for leaving the group cleanly.
    stop_grace_period: 15s

  raw-archive:
    container_name: l2-raw-archive
    build:
      # Build from the repo root so COPY can reach both requirements.txt and src/.
      context: .
      # The Dockerfile is colocated with the service it builds.
      dockerfile: src/raw_archive/Dockerfile
    # The second service that writes files, and the more important one: these are the frames
    # everything else is derived from. Buckets land in /app/raw inside the container and this
    # surfaces them on the host.
    volumes:
      - ./raw:/app/raw
    # Match the host uid:gid so the files are readable and deletable without sudo. Without this
    # the container runs as root and every file it writes is owned by root.
    user: "1000:1000"
    environment:
      REDPANDA_BROKERS: redpanda-0:9092
      # Its own group, for the same reason every other reader has one: members of a group split
      # the partitions between them, so a shared id on this single-partition topic would leave
      # one service reading nothing at all, with no error to say so. Here the group does a
      # second job as well -- it is what stops two archivers writing the same file.
      CONSUMER_GROUP: l2-raw-archive
    networks:
      - redpanda_network
    # Only the topic has to exist; an empty one is something to wait on, as it is for the book.
    depends_on:
      topic-init:
        condition: service_completed_successfully
    # on-failure, not unless-stopped: a crash exits non-zero and should come straight back, but
    # a reboot should start nothing at all. See the ingest service for what unless-stopped cost
    # us on 11 Sep. A clean stop exits zero, so `compose stop` still means stopped.
    # A restart goes back to the last bucket boundary and reads those frames again.
    restart: on-failure
    # A stop drops the bucket still being gathered and leaves its position unrecorded, which
    # costs nothing; the time here is for the fetch in flight and for leaving the group cleanly.
    stop_grace_period: 15s
